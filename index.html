<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout : colonne unique type arbre de liens — budget → setup → composant → offres par site */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#141A27; --muted:#5B6577; --line:#D5DBE5;
  --accent:#2F55E8; --accent-ink:#FFFFFF; --ok:#1E8A55; --warn:#A8650A; --warn-bg:#FBF0DC;
  --t1:#1E8A55; --t2:#2F55E8; --t3:#8A3FD1;
  --f-display:"Sora",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#161D2F; --ink:#E7EBF3; --muted:#98A2B6; --line:#28324A;
  --accent:#6E8CFF; --accent-ink:#0D1220; --ok:#4CC88A; --warn:#F0B35A; --warn-bg:#33270F;
  --t1:#4CC88A; --t2:#6E8CFF; --t3:#B98AF0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#161D2F; --ink:#E7EBF3; --muted:#98A2B6; --line:#28324A;
  --accent:#6E8CFF; --accent-ink:#0D1220; --ok:#4CC88A; --warn:#F0B35A; --warn-bg:#33270F;
  --t1:#4CC88A; --t2:#6E8CFF; --t3:#B98AF0; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:1.75rem;letter-spacing:-.01em}
h2{font-size:1.35rem}
.head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.mark{width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:1.1rem}
.sub{color:var(--muted);margin:0;max-width:42ch}
.stamp{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.stack{display:flex;flex-direction:column;gap:12px}
a{color:inherit}
.setup{position:relative;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:16px 18px 16px 22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;transition:border-color .15s,transform .15s;overflow:hidden}
.setup::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tier)}
.setup:hover,.setup:focus-visible{border-color:var(--tier);transform:translateY(-1px);outline:none}
.tier{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tier);grid-column:1/-1}
.setup .name{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.setup .total{font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums}
.setup .meta{grid-column:1/-1;color:var(--muted);font-size:.85rem}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.03em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:.88rem;color:var(--muted)}
.note strong{color:var(--ink)}
.back{align-self:flex-start;padding:4px 0;color:var(--accent);text-decoration:none}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.part{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.part summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 16px}
.part summary::-webkit-details-marker{display:none}
.part summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.part[open] summary{border-bottom:1px solid var(--line)}
.cat{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.model{font-weight:600;min-width:0}
.price{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;grid-row:1/3;grid-column:2;align-self:center}
.where{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.where b{color:var(--ok);font-weight:600}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 16px 4px}
.offers a,.search a{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:10px 16px;text-decoration:none;font-size:.9rem}
.offers a + a,.search a + a{border-top:1px solid var(--line)}
.offers a:hover,.offers a:focus-visible,.search a:hover,.search a:focus-visible{background:var(--bg);outline:none}
.site{font-weight:600;min-width:7.5em}
.what{color:var(--muted);font-size:.82rem;min-width:0}
.op{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.offers a.best .op,.offers a.best .site{color:var(--ok)}
.search{border-top:1px solid var(--line)}
.search a{grid-template-columns:1fr auto;color:var(--accent)}
.warn{font-size:.8rem;color:var(--warn);background:var(--warn-bg);padding:8px 16px}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-radius:12px;background:var(--tier);color:var(--accent-ink)}
.sum b{font-family:var(--f-mono);font-size:1.2rem;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.85rem;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.deal{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 16px;text-decoration:none;border-bottom:1px solid var(--line)}
.deal:hover,.deal:focus-visible{background:var(--bg);outline:none}
.deal .price.ok{color:var(--ok)}
.deal .price.mid{color:var(--muted)}
h3{font-family:var(--f-display);font-size:1.05rem;margin:8px 0 0}
.badge{font-family:var(--f-body);font-size:.68rem;font-weight:600;letter-spacing:.02em;text-transform:none;padding:1px 8px;border-radius:99px;margin-left:6px}
.badge.ok{color:var(--ok);border:1px solid currentColor}
.badge.mid{color:var(--warn);background:var(--warn-bg)}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump a{font-size:.8rem;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);text-decoration:none}
.jump a:hover,.jump a:focus-visible{border-color:var(--accent);outline:none}
.cmp{display:flex;justify-content:space-between;gap:12px;padding:8px 16px;font-size:.88rem}
.cmp + .cmp{border-top:1px solid var(--line)}
footer{font-size:.78rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const SEARCH = [
  ["Amazon", q=>"https://www.amazon.fr/s?k="+encodeURIComponent(q)],
  ["Cdiscount", CDS],
  ["AliExpress", ALI],
  ["PcComponentes", q=>"https://www.pccomponentes.fr/search/?query="+encodeURIComponent(q)],
  ["Tous les prix (Idealo)", q=>"https://www.idealo.fr/prechcat.html?q="+encodeURIComponent(q)],
  ["Bons plans (Dealabs)", q=>"https://www.dealabs.com/search?q="+encodeURIComponent(q)]
];
const eur = n => n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const best = p => p.offres[0];
const total = s => s.parts.reduce((a,p)=>a+best(p)[1],0);
const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app = document.getElementById("app");

function home(){
  app.innerHTML = `
  <header class="head">
    <div class="mark">PC</div>
    <h1>Setups du Jour</h1>
    <p class="sub">Trois configs PC au meilleur prix, comparées chaque jour sur Amazon, Cdiscount, AliExpress et les autres.</p>
    <span class="stamp">PRIX RELEVÉS LE ${DATA.date} · ${DATA.heure}</span>
  </header>
  <nav class="stack" aria-label="Setups par budget">
    ${DATA.setups.map(s=>`
      <a class="setup" href="#${s.id}" style="--tier:var(${s.couleur})">
        <span class="tier">${esc(s.tier)}</span>
        <span class="name">${esc(s.nom)}</span>
        <span class="total">${eur(total(s))}</span>
        <span class="meta">${esc(s.usage)}</span>
        <span class="chips">${s.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</span>
      </a>`).join("")}
    <a class="setup" href="#affaires" style="--tier:var(--warn)">
      <span class="tier">Bons plans</span>
      <span class="name">Meilleures affaires du jour</span>
      <span class="total">${DATA.affaires.reduce((n,g)=>n+g.items.length,0)} offres</span>
      <span class="meta">Composants, écrans, souris, claviers, chaises, bureaux et accessoires</span>
    </a>
  </nav>
  <div class="note"><strong>Pourquoi les prix sont si hauts ?</strong> La pénurie de mémoire fait flamber la DDR5 et les cartes graphiques. On te montre quand même, composant par composant, le site le moins cher du jour.</div>
  <footer>Prix susceptibles d'avoir changé depuis le relevé. Certains liens peuvent être affiliés.</footer>`;
}

function setup(s){
  app.innerHTML = `
  <a class="back" href="#">← Tous les budgets</a>
  <header class="stack" style="gap:6px">
    <span class="tier" style="--tier:var(${s.couleur});color:var(--tier);font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase">${esc(s.tier)}</span>
    <h2>${esc(s.nom)}</h2>
    <p class="sub" style="max-width:none">${esc(s.usage)}</p>
    <span class="stamp">PRIX RELEVÉS LE ${DATA.date} · ${DATA.heure}</span>
  </header>
  <div class="stack">
    ${s.parts.map((p,i)=>{const b=best(p);return `
      <details class="part" id="p-${s.id}-${i}">
        <summary>
          <span class="cat">${esc(p.cat)}</span>
          <span class="price">${eur(b[1])}</span>
          <span class="model">${esc(p.modele)}</span>
          <span class="where">Moins cher chez <b>${esc(b[0])}</b> · ${p.offres.length} offre${p.offres.length>1?"s":""} comparée${p.offres.length>1?"s":""}</span>
        </summary>
        <div class="lbl">Prix relevés aujourd'hui</div>
        <div class="offers">
          ${p.offres.map((o,k)=>`<a href="${o[3]}" target="_blank" rel="noopener" class="${k===0?"best":""}"><span class="site">${esc(o[0])}</span><span class="what">${esc(o[2])}</span><span class="op">${eur(o[1])} ↗</span></a>`).join("")}
        </div>
        ${p.offres.some(o=>o[0]==="AliExpress")?`<div class="warn">AliExpress : vérifie au panier les frais d'import et le délai, et privilégie les vendeurs les mieux notés.</div>`:""}
        <div class="search">
          <div class="lbl">Chercher ce modèle ailleurs</div>
          ${SEARCH.map(([n,f])=>`<a href="${f(p.q)}" target="_blank" rel="noopener"><span>${esc(n)}</span><span>↗</span></a>`).join("")}
        </div>
      </details>`}).join("")}
  </div>
  <div class="sum" style="--tier:var(${s.couleur})"><span>Total du setup</span><b>${eur(total(s))}</b></div>
  <div class="note"><strong>Le conseil :</strong> ${esc(s.astuce)}</div>
  <div class="row">
    <button class="btn" id="openall">Tout déplier</button>
    <button class="btn" id="copy">Copier le lien de ce setup</button>
  </div>`;
  document.getElementById("openall").onclick = e => {
    const all = app.querySelectorAll("details"); const open = [...all].some(d=>!d.open);
    all.forEach(d=>d.open=open); e.target.textContent = open?"Tout replier":"Tout déplier";
  };
  document.getElementById("copy").onclick = e => {
    const url = location.href.split("#")[0]+"#"+s.id;
    try{ navigator.clipboard.writeText(url).then(()=>e.target.textContent="Lien copié",()=>e.target.textContent=url); }
    catch(_){ e.target.textContent = url; }
  };
}

const STATUT={bon:["Bon plan","ok"],moyen:["Prix habituel","mid"],nv:["Historique non vérifié","mid"]};
function deals(){
  app.innerHTML = `
  <a class="back" href="#">← Tous les budgets</a>
  <header class="stack" style="gap:6px">
    <span style="color:var(--warn);font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase">Bons plans</span>
    <h2>Meilleures affaires du jour</h2>
    <p class="sub" style="max-width:none">Seules les vraies baisses sont marquées « Bon plan ». Les autres sont signalées comme prix habituel.</p>
    <span class="stamp">PRIX RELEVÉS LE ${DATA.date} · ${DATA.heure}</span>
  </header>
  <nav class="jump" aria-label="Sous-sections">${DATA.affaires.map((g,i)=>`<a href="#affaires" data-to="g${i}">${esc(g.titre)}</a>`).join("")}</nav>
  ${DATA.affaires.map((g,i)=>`
  <section class="stack" id="g${i}">
    <h3>${esc(g.titre)}</h3>
    ${g.items.map(a=>{const st=STATUT[a.statut]||STATUT.nv;return `
      <div class="part">
        <a class="deal" href="${a.lien}" target="_blank" rel="noopener">
          <span class="cat">${esc(a.site)} <span class="badge ${st[1]}">${st[0]}</span></span>
          <span class="price ${st[1]}">${eur(a.prix)} ↗</span>
          <span class="model">${esc(a.titre)}</span>
          <span class="where">${esc(a.pourquoi)}</span>
        </a>
        <div class="lbl">Comparé à</div>
        <div class="offers">${a.comp.map(c=>`<div class="cmp"><span class="what">${esc(c[0])}</span><span class="op">${eur(c[1])}</span></div>`).join("")}</div>
      </div>`}).join("")}
  </section>`).join("")}
  <footer>Historiques Amazon vérifiés sur camelcamelcamel, prix de référence Cdiscount sur 30 jours. Une affaire peut disparaître dans la journée : vérifie le prix au panier.</footer>`;
  app.querySelectorAll(".jump a").forEach(l=>l.onclick=e=>{e.preventDefault();document.getElementById(l.dataset.to).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});});
}

function route(){
  const s = DATA.setups.find(x=>"#"+x.id===location.hash);
  location.hash==="#affaires" ? deals() : s ? setup(s) : home();
  window.scrollTo(0,0);
}
addEventListener("hashchange", route);
route();
</script>
